apiVersion: icp4a.ibm.com/v1
kind: ICP4ACluster
metadata:
  labels:
    app.kubernetes.io/instance: ibm-dba
    app.kubernetes.io/managed-by: ibm-dba
    app.kubernetes.io/name: ibm-dba
    release: 20.0.3
  name: icp4adeploy
spec:
  ads_configuration:
    credentials_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-credentials
        tag: 20.0.3
    decision_designer:
      enabled: true
    decision_runtime:
      enabled: true
    decision_runtime_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-runtime
        tag: 20.0.3
    download_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-download
        tag: 20.0.3
      ums_enabled: true
    embedded_build_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-build
        tag: 20.0.3
    embedded_runtime_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-runtime
        tag: 20.0.3
    front:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-front
        tag: 20.0.3
    git_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-gitservice
        tag: 20.0.3
    parsing_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-parsing
        tag: 20.0.3
    rest_api:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-restapi
        tag: 20.0.3
    rr_integration:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-rrintegration
        tag: 20.0.3
    run_service:
      image:
        repository: cp.icr.io/cp/cp4a/ads/ads-run
        tag: 20.0.3
  appVersion: 20.0.3
  application_engine_configuration:
  - images:
      db_job:
        repository: cp.icr.io/cp/cp4a/aae/solution-server-helmjob-db
        tag: 20.0.3
      solution_server:
        repository: cp.icr.io/cp/cp4a/aae/solution-server
        tag: 20.0.3
    name: workspace
  baml_configuration:
    intelligent_task_prioritization:
      image:
        repository: cp.icr.io/cp/cp4a/baw/bui-task-prioritization
        tag: 20.0.3
    workforce_insights:
      image:
        repository: cp.icr.io/cp/cp4a/baw/workforce-insights
        tag: 20.0.3
  bastudio_configuration:
    images:
      bastudio:
        repository: cp.icr.io/cp/cp4a/bas/bastudio
        tag: 20.0.3
    jms_server:
      image:
        repository: cp.icr.io/cp/cp4a/bas/jms
        tag: 20.0.3
    playback_server:
      images:
        db_job:
          repository: cp.icr.io/cp/cp4a/bas/solution-server-helmjob-db
          tag: 20.0.3
        solution_server:
          repository: cp.icr.io/cp/cp4a/bas/solution-server
          tag: 20.0.3
  ca_configuration:
    deeplearning:
      gpu_enabled: false
      nodelabel_key: null
      nodelabel_value: null
  ecm_configuration:
    cmis:
      image:
        repository: cp.icr.io/cp/cp4a/fncm/cmis
        tag: ga-305-cmis-if002
    cpe:
      image:
        repository: cp.icr.io/cp/cp4a/fncm/cpe
        tag: ga-556-p8cpe
    css:
      image:
        repository: cp.icr.io/cp/cp4a/fncm/css
        tag: ga-556-p8css
    document_processing:
      cdra:
        image:
          repository: cp.icr.io/cp/cp4a/iadp/cdra
          tag: 20.0.3
      cds:
        image:
          repository: cp.icr.io/cp/cp4a/iadp/cds
          tag: 20.0.3
      cpds:
        image:
          repository: cp.icr.io/cp/cp4a/iadp/cpds
          tag: 20.0.3
      gitgateway:
        image:
          repository: cp.icr.io/cp/cp4a/iadp/gitgateway
          tag: 20.0.3
      mongo:
        image:
          repository: cp.icr.io/cp/cp4a/iadp/mongo
          tag: 4.2.10
      viewone:
        image:
          repository: cp.icr.io/cp/cp4a/iadp/viewone
          tag: 20.0.3
    es:
      image:
        repository: cp.icr.io/cp/cp4a/fncm/extshare
        tag: ga-309-es
    graphql:
      image:
        repository: cp.icr.io/cp/cp4a/fncm/graphql
        tag: ga-556-p8cgql
  elasticsearch_configuration:
    es_image:
      repository: cp.icr.io/cp/cp4a/baw/pfs-elasticsearch-prod
      tag: 20.0.3
    es_init_image:
      repository: cp.icr.io/cp/cp4a/baw/pfs-init-prod
      tag: 20.0.3
    es_nginx_image:
      repository: cp.icr.io/cp/cp4a/baw/pfs-nginx-prod
      tag: 20.0.3
  ibm_license: accept
  ier_configuration:
    image:
      repository: cp.icr.io/cp/cp4a/ier/ier
      tag: ga-521-ier-fp005
  navigator_configuration:
    image:
      repository: cp.icr.io/cp/cp4a/ban/navigator-sso
      tag: ga-309-icn
  odm_configuration:
    decisionCenter:
      enabled: true
    decisionRunner:
      enabled: true
    decisionServerRuntime:
      enabled: true
    image:
      pullSecrets: admin.registrykey
      repository: cp.icr.io/cp/cp4a/odm
  pfs_configuration:
    image:
      repository: cp.icr.io/cp/cp4a/baw/pfs-prod
      tag: 20.0.3
  resource_registry_configuration:
    images:
      resource_registry:
        repository: cp.icr.io/cp/cp4a/aae/dba-etcd
        tag: 20.0.3
  shared_configuration:
    image_pull_secrets:
    - admin.registrykey
    images:
      busybox:
        repository: cp.icr.io/cp/cp4a/demo/busybox
        tag: 1.32
      db2:
        repository: docker.io/ibmcom/db2
        tag: 11.5.1.0-CN1
      db2_alpine:
        repository: cp.icr.io/cp/cp4a/demo/alpine
        tag: 3.6
      db2_auxiliary:
        repository: docker.io/ibmcom/db2u.auxiliary.auth
        tag: 11.5.1.0-CN1
      db2_etcd:
        repository: quay.io/coreos/etcd
        tag: v3.3.10
      db2_init:
        repository: docker.io/ibmcom/db2u.instdb
        tag: 11.5.1.0-CN1
      db2u_tools:
        repository: docker.io/ibmcom/db2u.tools
        tag: 11.5.1.0-CN1
      dbcompatibility_init_container:
        repository: cp.icr.io/cp/cp4a/aae/dba-dbcompatibility-initcontainer
        tag: 20.0.3
      gitea:
        repository: cp.icr.io/cp/cp4a/demo/gitea
        tag: 1.12.3
      keytool_init_container:
        repository: cp.icr.io/cp/cp4a/ums/dba-keytool-initcontainer
        tag: 20.0.3
      keytool_job_container:
        repository: cp.icr.io/cp/cp4a/ums/dba-keytool-jobcontainer
        tag: 20.0.3
      openldap:
        repository: cp.icr.io/cp/cp4a/demo/openldap
        tag: 1.3.0
      phpldapadmin:
        repository: cp.icr.io/cp/cp4a/demo/phpldapadmin
        tag: 0.9.0
      umsregistration_initjob:
        repository: cp.icr.io/cp/cp4a/aae/dba-umsregistration-initjob
        tag: 20.0.3
    root_ca_secret: '{{ meta.name }}-root-ca'
    sc_cpe_limited_storage: true
    sc_deployment_baw_license: non-production
    sc_deployment_fncm_license: non-production
    sc_deployment_hostname_suffix: '{{ meta.namespace }}.CHANGEDOMAIN' #TODO change on run
    sc_deployment_license: non-production
    sc_deployment_patterns: foundation,application,content,decisions,decisions_ads,document_processing,workflow-workstreams
    sc_deployment_platform: ROKS
    sc_deployment_type: demo
    sc_image_repository: cp.icr.io
    sc_ingress_enable: false
    sc_optional_components: ads_designer,ads_runtime,baw_authoring,cmis,css,decisionCenter,decisionRunner,decisionServerRuntime,document_processing_designer,es,ier,tm,ums
    sc_run_as_user: null
    storage_configuration:
      sc_dynamic_storage_classname: ibmc-file-gold-gid
      sc_fast_file_storage_classname: ibmc-file-gold-gid
      sc_medium_file_storage_classname: ibmc-file-silver-gid
      sc_slow_file_storage_classname: ibmc-file-bronze-gid
    trusted_certificate_list: []
  ums_configuration:
    images:
      ums:
        repository: cp.icr.io/cp/cp4a/ums/ums
        tag: 20.0.3
    teamserver:
      admingroup: cn=ADPEnvironmentOwners,dc=example,dc=org
  workflow_authoring_configuration:
    bas_auto_import_job:
      repository: cp.icr.io/cp/cp4a/baw/toolkit-installer
      tag: 20.0.3
    case:
      init_job_image:
        repository: cp.icr.io/cp/cp4a/baw/workflow-server-case-initialization
        tag: 20.0.3
    content_integration:
      init_job_image:
        repository: cp.icr.io/cp/cp4a/baw/iaws-ps-content-integration
        tag: 20.0.3
    ibm_workplace_job:
      repository: cp.icr.io/cp/cp4a/baw/iaws-ibm-workplace
      tag: 20.0.3
    image:
      repository: cp.icr.io/cp/cp4a/bas/workflow-authoring
      tag: 20.0.3
    jms:
      image:
        repository: cp.icr.io/cp/cp4a/baw/jms
        tag: 20.0.3
    pfs_bpd_database_init_job:
      repository: cp.icr.io/cp/cp4a/baw/pfs-bpd-database-init-prod
      tag: 20.0.3
    upgrade_job:
      repository: cp.icr.io/cp/cp4a/baw/workflow-server-dbhandling
      tag: 20.0.3
